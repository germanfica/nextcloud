# Example usage (RFC 5737 - TEST-NET-1, documentation-only address):
# ansible-playbook -i '192.0.2.10,' -u username -K playbooks/deploy-remote.yml
---
# Runs against the SSH inventory target(s) DIRECTLY. No archive, remote source
# directory replacement, expect/pexpect, or recursive deletion is necessary.
# Docker Engine + Compose must already be installed on the target(s).
- name: Deploy Nextcloud AIO and NPM to remote hosts
  ansible.builtin.import_playbook: install-services.yml
  vars:
    TARGET_HOSTS: all
    TARGET_CONNECTION: ssh
