---
# Local entry point. Reuse the existing Docker installation playbook.
- name: Install Docker Engine and Compose
  ansible.builtin.import_playbook: install-docker.yml

- name: Deploy Nextcloud AIO
  ansible.builtin.import_playbook: install-nextcloud.yml

- name: Deploy local Nginx Proxy Manager
  ansible.builtin.import_playbook: install-nginx-proxy-manager.yml
